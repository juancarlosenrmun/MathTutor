spring:
  application:
    name: mathtutor
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.checkserveridentity]": true
  jpa:
    # RNF-03: la respuesta SSE no conserva un EntityManager ni una conexión JDBC.
    open-in-view: false

  # Cargar .env si existe (opcional, no falla si no está)
  config:
    import: "optional:file:.env[.properties]"

  # Perfil de desarrollo con PostgreSQL local (Docker Compose)
  profiles:
    active: dev
    group:
      notes-indexing: spring-ai-pgvector

jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

app:
  password-reset:
    page: ${PASSWORD_RESET_PAGE:}
    from: ${PASSWORD_RESET_FROM:}

# RAG Configuration
tutor:
  quota:
    daily-tokens: ${TUTOR_DAILY_TOKENS:100000}
    # USD por millón de tokens. El prototipo usa el nivel gratuito. -1 indica tarifa desconocida.
    usd-per-million-input: ${TUTOR_USD_PER_MILLION_INPUT:0}
    usd-per-million-output: ${TUTOR_USD_PER_MILLION_OUTPUT:0}
  rag:
    # Umbral de similitud coseno para búsqueda vectorial (0.0-1.0).
    # Obligatorio: debe estar configurado. Recomendado 0.7 (distancia coseno < 0.3).
    # Se valida al arrancar: falla rápido si no configurado o fuera de rango.
    similarity-threshold: 0.7

---

spring:
  config:
    activate:
      on-profile: dev | production

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mathtutor}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Spring AI (configurar cuando se use)
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}

---

# El proveedor Google puede activarse junto a cualquier perfil de infraestructura.
spring:
  config:
    activate:
      on-profile: google-ai-studio
  ai:
    google:
      ai-studio:
        api-key: ${GOOGLE_AI_API_KEY:}
        embedding-model: ${GOOGLE_AI_EMBEDDING_MODEL:gemini-embedding-001}
        embedding-dimensions: 768
        chat-model: ${GOOGLE_AI_CHAT_MODEL:gemini-3.5-flash-lite}
        temperature: 0.7
        max-output-tokens: 8192
        # Una petición de generación por turno: no reintentar ni cambiar a un modelo de pago.
        max-retries: 0
        # Ajustar a la cuota del proyecto/modelo en AI Studio; no hay RPM universal del nivel gratuito.
        max-requests-per-minute: ${GOOGLE_AI_MAX_REQUESTS_PER_MINUTE:5}

---

# Perfil de test (Testcontainers)
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16:///mathtutor?driver=org.postgresql.Driver
    username: postgres
    password: postgres
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.mathtutor: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080

---

spring:
  config:
    activate:
      on-profile: production

mathtutor:
  security:
    secure-cookies: true

logging:
  structured:
    format:
      console: ecs
  level:
    com.mathtutor: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

server:
  port: ${HTTPS_PORT:8443}
  ssl:
    enabled: true
    enabled-protocols: TLSv1.3,TLSv1.2
    key-store-type: PKCS12
    key-store: ${TLS_KEYSTORE}
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
