# Testcontainers configuration for CI
# This file is read by Testcontainers at startup
# See: https://java.testcontainers.org/features/configuration/

# Docker host configuration
docker.host=unix:///var/run/docker.sock
testcontainers.docker.socket.override=/var/run/docker.sock

# Disable Ryuk (cleanup container) to avoid issues in CI
testcontainers.ryuk.disabled=true

# Reuse containers if possible (optional)
# testcontainers.reuse.enable=true