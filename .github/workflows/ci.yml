name: CI

on:
  push:
    branches: [ DEV, main ]
  pull_request:
    branches: [ DEV, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Set environment variables at job level so they're inherited by forked test JVMs
    env:
      # Spring profiles for tests with Testcontainers (test for unit, spring-ai-pgvector for Spring AI integration)
      SPRING_PROFILES_ACTIVE: test,spring-ai-pgvector
      # Testcontainers Docker host - use host Docker daemon
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      DOCKER_HOST: unix:///var/run/docker.sock
      # Disable Ryuk (Testcontainers cleanup container) to avoid issues in CI
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Verify Docker is running
        run: docker version && docker ps

      - name: Fix Docker socket permissions
        # GitHub Actions runner may not have permission to access /var/run/docker.sock
        run: |
          sudo chmod 666 /var/run/docker.sock
          echo "=== Docker socket after chmod ==="
          ls -la /var/run/docker.sock
          # Verify the current user can access it
          docker version

      - name: Debug environment variables
        run: |
          echo "=== Shell environment ==="
          env | grep -E 'DOCKER|TESTCONTAINERS|SPRING_PROFILES'
          echo "=== Docker socket ==="
          ls -la /var/run/docker.sock
          echo "=== Test Docker access ==="
          docker version
          docker ps

      - name: Build and test with Gradle
        run: ./gradlew clean check --no-daemon --no-scan

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/**/*.xml
            **/build/reports/jacoco/aggregate/**/*.xml
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          # Verificar que los informes JaCoCo existen
          find . -name "jacoco*.xml" -type f | head -20
        if: always()

  verify-coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()

    steps:
      - name: Download JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: jacoco-reports

      - name: Verify coverage thresholds
        run: |
          # Script para verificar umbrales de cobertura (80% líneas, 70% ramas)
          # Los umbrales se aplican en ./gradlew check, pero aquí hacemos una verificación adicional
          echo "Verifying coverage reports..."
          find jacoco-reports -name "*.xml" -type f | while read file; do
            echo "Checking $file"
            # Extract coverage from XML (simplified check)
            if grep -q 'line-rate="0\.' "$file"; then
              echo "WARNING: Low line coverage in $file"
            fi
          done
          echo "Coverage verification completed"
        if: always()