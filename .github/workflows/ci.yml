name: CI

on:
  push:
    branches: [ DEV, main, sprint-1 ]
  pull_request:
    branches: [ DEV, main, sprint-1 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No Docker env vars needed - integration tests are skipped on CI via @EnabledIfEnvironmentVariable
    # Unit tests use H2 in-memory database, no Docker required.
    # Disable Testcontainers entirely to prevent any container startup attempts
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      testcontainers.disabled: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build and test with Gradle
        run: ./gradlew clean check --no-daemon --no-scan

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/**/*.xml
            **/build/reports/jacoco/aggregate/**/*.xml
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          # Verificar que los informes JaCoCo existen
          find . -name "jacoco*.xml" -type f | head -20
        if: always()

  verify-coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()

    steps:
      - name: Download JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: jacoco-reports

      - name: Verify coverage thresholds
        run: |
          # Script para verificar umbrales de cobertura (80% líneas, 70% ramas)
          # Los umbrales se aplican en ./gradlew check, pero aquí hacemos una verificación adicional
          echo "Verifying coverage reports..."
          find jacoco-reports -name "*.xml" -type f | while read file; do
            echo "Checking $file"
            # Extract coverage from XML (simplified check)
            if grep -q 'line-rate="0\.' "$file"; then
              echo "WARNING: Low line coverage in $file"
            fi
          done
          echo "Coverage verification completed"
        if: always()