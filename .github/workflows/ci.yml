name: CI

on:
  push:
    branches: [ DEV, main, sprint-1, 'dev/**' ]
  pull_request:
    branches: [ DEV, main, sprint-1 ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Set up Node.js for WebGL tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Docker is running
        run: docker version
      - name: Test integration verification gate
        run: python3 scripts/test_verify_integration_results.py
      - name: Build, integration tests and coverage thresholds
        run: ./gradlew clean check jacocoAggregateReport --no-daemon --no-scan
      - name: Verify integration tests were executed
        if: always()
        run: python3 scripts/verify-integration-results.py
      - name: Compile shaders and verify rendered pixels in a real browser
        run: python3 scripts/smoke-webgl.py
      - name: Upload test and coverage evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-1-verification
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/jacoco/**
            **/build/reports/client/**
            **/build/reports/client-browser/**
          if-no-files-found: error
          retention-days: 7
