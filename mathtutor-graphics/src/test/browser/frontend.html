<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contrato del frontend S1 y S2</title>
<body><p id="result">Verificando interfaz…</p><iframe title="MathTutor bajo prueba" style="width:1200px;height:900px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const settle = () => new Promise(resolve => setTimeout(resolve, 30));
try {
  let html = await (await fetch('/visor/index.html')).text();
  html = html.replace('<head>', '<head><base href="/visor/">').replace('<script type="module" src="./main.mjs"></' + 'script>', `
    <script>
    window.testState = { role: 'ALUMNO', status: 200, calls: [], sessions: [], turns: [], runs: [] };
    window.fetch = async (path, options) => {
      testState.calls.push([path, options]);
      if (path.endsWith('/modules')) return {ok:true,json:async()=>[
        {code:'funciones',name:'Funciones'},{code:'derivadas-integrales',name:'Derivadas e integrales'},{code:'metodos-3d',name:'Métodos 3D'}]};
      const json = data => ({ok:true,json:async()=>data});
      const stream = events => ({ok:true,body:new ReadableStream({start(c){
        c.enqueue(new TextEncoder().encode(events.map(e=>'data:'+JSON.stringify(e)+String.fromCharCode(10,10)).join('')));c.close();}})});
      if (path.includes('/progress')) return json(testState.sessions);
      if (path.includes('/history')) return json(testState.turns);
      if (path.includes('/bank')) return json([{id:7,statement:'Deriva x^2',difficulty:1}]);
      if (path.includes('/exercises')) {
        if (options.method === 'POST') testState.runs=[{id:1,statement:'Derivar x^2',state:'COMENZADO',progress:0}];
        return json(options.method === 'POST' ? testState.runs[0] : testState.runs);
      }
      if (path.endsWith('/sessions')) {
        const created={id:testState.sessions.length+1,moduleCode:JSON.parse(options.body).moduleCode,status:'ACTIVA'};
        testState.sessions.unshift({...created,module:created.moduleCode});return json(created);
      }
      if (path.endsWith('/messages')) {
        const body=JSON.parse(options.body);
        testState.turns=[{id:1,...body,response:'Piensa en el dominio.',status:'COMPLETADO',verdict:'CORRECTO',diagnosis:'NINGUNO',topic:'derivadas'}];
        return stream([{type:'TOKEN',content:'Piensa en el dominio.'},{type:'DONE'}]);
      }
      if (path.endsWith('/graphics')) return stream([{type:'GRAPHIC_SPEC',spec:JSON.parse(options.body)},{type:'DONE'}]);
      const status = path.endsWith('csrf-token') ? 200 : path.endsWith('refresh') ? 401 : testState.status;
      return { ok: status < 400, status, json: async () => path.endsWith('csrf-token') ? { csrfToken: 'csrf' }
        : { data: { accessToken: 'jwt', role: testState.role, email: 'alumno@ejemplo.es' } } };
    };
    </` + `script><script type="module">import { mount } from '/visor/app.mjs'; window.testApp = mount(document);</` + `script>`);
  frame.srcdoc = html;
  await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  const win = frame.contentWindow, doc = frame.contentDocument;
  assert(!doc.querySelector('#privacy-banner').hidden, 'Falta aviso de cookies');
  doc.querySelector('#privacy-reject').click();
  assert(doc.querySelector('#privacy-banner').hidden, 'Rechazar no cierra el aviso');
  assert(doc.cookie.includes('mathtutor_cookies=reject.v1'), 'No se recuerda el rechazo');
  doc.querySelector('#privacy-manage').click();
  assert(!doc.querySelector('#privacy-banner').hidden, 'No se pueden cambiar preferencias');
  doc.querySelector('#privacy-accept').click();
  assert(doc.cookie.includes('mathtutor_cookies=accept.v1'), 'No se recuerda la aceptación');
  await win.testApp.ready;
  // Esperar la cola nativa de locks, sin asumir que 30 ms equivalen a una respuesta.
  const idle = async () => { await win.navigator.locks.request('mathtutor-auth-cookie', () => {}); await settle(); };
  const go = async view => { win.location.hash = '#/' + view; await settle(); };
  const visible = () => [...doc.querySelectorAll('[data-view]')].filter(node => !node.hidden);
  assert(visible().length === 1, 'Debe haber una sola vista activa');
  for (const width of [1440, 1024, 768, 375, 320]) {
    frame.style.width = width + 'px';
    for (const view of ['inicio', 'acceso', 'registro', 'laboratorio', 'restringido']) {
      await go(view);
      assert(visible()[0].dataset.view === view, 'Ruta incorrecta: ' + view);
      assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, 'Desbordamiento: ' + view + '/' + width);
      assert(doc.title.includes('MathTutor'), 'Falta título');
    }
  }
  await go('cuenta'); assert(visible()[0].dataset.view === 'acceso', 'Cuenta sin protección');
  await go('espacio'); assert(visible()[0].dataset.view === 'acceso', 'Espacio sin protección');
  await go('registro');
  const register = doc.querySelector('[data-auth="register"]');
  register.elements.email.value = 'alumno@ejemplo.es';
  register.elements.password.value = 'UnaClaveSegura12!'; register.elements.confirm.value = 'otra';
  register.dispatchEvent(new Event('submit', { cancelable: true })); await settle();
  assert(!register.querySelector('[data-error]').hidden, 'Confirmación sin validar');
  register.elements.confirm.value = 'UnaClaveSegura12!';
  register.dispatchEvent(new Event('submit', { cancelable: true }));
  await idle();
  assert(visible()[0].dataset.view === 'espacio', 'Registro no abre tu espacio: ' + register.querySelector('[data-error]').textContent);
  assert(doc.querySelector('#account-email').textContent === 'alumno@ejemplo.es', 'Correo no mostrado');
  const call = win.testState.calls.find(([path]) => path.endsWith('register'));
  assert(JSON.parse(call[1].body).role === 'ALUMNO', 'Registro permite escalar rol');
  for (const width of [1440, 1024, 768, 375, 320]) {
    frame.style.width = width + 'px';
    for (const view of ['espacio', 'cuenta', 'laboratorio', 'tutor']) {
      await go(view);
      assert(visible()[0].dataset.view === view, 'Ruta autenticada incorrecta: ' + view);
      assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, 'Desbordamiento autenticado: ' + view);
    }
  }
  await go('tutor');
  assert(doc.querySelector('#tutor-block').options.length === 3, 'Falta catálogo de módulos');
  assert(doc.querySelectorAll('#tutor-topics button').length === 3, 'Las tarjetas no siguen el catálogo');
  doc.querySelector('#tutor-select-form').dispatchEvent(new Event('submit', {cancelable:true})); await settle();
  assert(!doc.querySelector('#tutor-composer').hidden, 'No se inicia conversación');
  assert(doc.querySelector('#tutor-viewer-slot .viewer-panel'), 'El visor no aparece junto al chat');
  doc.querySelector('[data-prompt="notes"]').click();
  assert(doc.querySelector('#tutor-message').value === '¿Qué es la continuidad de una función?',
    'La pregunta sugerida no corresponde al módulo');
  doc.querySelector('#tutor-message').value = '¿Qué es una función?';
  doc.querySelector('#tutor-form').dispatchEvent(new Event('submit', {cancelable:true})); await settle();
  assert(doc.querySelector('#tutor-history').textContent.includes('Piensa en el dominio.'), 'SSE no llega al historial');
  assert(doc.querySelector('#tutor-status').textContent.includes('completada'), 'Falta fin de turno');
  assert(doc.querySelector('#tutor-diagnosis').textContent.includes('verificado'), 'Falta diagnóstico persistido');
  const messageCall = win.testState.calls.find(([path]) => path.endsWith('/messages'));
  assert(typeof JSON.parse(messageCall[1].body).requestId === 'string', 'El turno no incluye UUID');
  doc.querySelector('#tutor-study').open = true;
  doc.querySelector('#exercise-expression').value = 'x^2';
  doc.querySelector('#exercise-form').dispatchEvent(new Event('submit', {cancelable:true})); await settle();
  assert(doc.querySelector('#exercise-runs').textContent.includes('Derivar'), 'Falta progreso del ejercicio');
  const graphicDetails=doc.querySelector('#graphic-form').closest('details');graphicDetails.open=true;
  doc.querySelector('#graphic-form').dispatchEvent(new Event('submit', {cancelable:true}));await settle();
  assert(doc.querySelector('#graphic-result').textContent.includes('f(x)'), 'La gráfica no se interpreta');
  for (const width of [1440,1024,768,375,320]) {
    frame.style.width=width+'px';await settle();
    assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+1,'Desbordamiento de herramientas S4 a '+width);
  }
  doc.querySelector('#tutor-new').click();
  doc.querySelector('#tutor-sessions button').click();await settle();
  assert(doc.querySelector('#tutor-history').textContent.includes('Piensa en el dominio.'),'La conversación guardada no se recupera');
  await go('laboratorio');
  assert(doc.querySelector('.lab-layout > .viewer-panel'), 'El visor no vuelve al laboratorio');
  doc.querySelector('#curve-form').dispatchEvent(new Event('submit', {cancelable:true})); await settle();
  assert(doc.querySelector('#curve-result').textContent.includes('0,666'), 'Falta integral 2D');
  await go('espacio');
  for (const [role, label] of [['ALUMNO', 'Alumno'], ['PROFESOR', 'Profesor'], ['ADMIN', 'Administrador']]) {
    win.testState.role = role; await win.testApp.updateRole();
    assert(doc.querySelector('#workspace-role').textContent === label, 'Espacio con rol obsoleto');
  }
  assert(doc.querySelector('[data-view="espacio"] a[href="#/tutor"]'), 'No se puede abrir el tutor');
  await go('cuenta');
  win.testState.role = 'PROFESOR'; await win.testApp.updateRole();
  assert(doc.querySelector('#role').textContent === 'PROFESOR', 'Rol obsoleto');
  await go('laboratorio');
  doc.querySelector('.skip-link').click(); await settle();
  assert(visible()[0].dataset.view === 'laboratorio', 'Saltar al contenido cambia de ruta');
  assert(doc.querySelector('canvas').width > 1, 'Visor sin tamaño después de navegar');
  assert(doc.querySelector('#graphic-status').textContent.includes('Visor listo.'), 'Visor no disponible');
  doc.querySelector('[data-camera="reset"]').click();
  doc.querySelector('#logout').click(); await idle();
  assert(visible()[0].dataset.view === 'acceso', 'Cierre no vuelve a acceso');
  const login = doc.querySelector('[data-auth="login"]');
  win.testState.status = 429;
  login.elements.email.value = 'alumno@ejemplo.es'; login.elements.password.value = 'UnaClaveSegura12!';
  login.dispatchEvent(new Event('submit', { cancelable: true }));
  await idle();
  assert(login.querySelector('[data-error]').textContent.includes('Demasiados'), 'Falta error de límite');
  win.testState.status = 200;
  login.elements.password.value = 'UnaClaveSegura12!'; login.dispatchEvent(new Event('submit', { cancelable: true }));
  await idle();
  assert(visible()[0].dataset.view === 'espacio', 'Login no abre tu espacio');
  win.testState.status = 403; await win.testApp.updateRole(); await settle();
  assert(visible()[0].dataset.view === 'restringido', '403 sin vista de acceso restringido');
  const { SessionClient } = await import('/visor/session.mjs');
  let concurrent = 0, maximum = 0;
  const fetcher = async path => {
    if (path.endsWith('csrf-token')) return { ok: true, json: async () => ({ csrfToken: 'csrf' }) };
    maximum = Math.max(maximum, ++concurrent); await settle(); concurrent--;
    return { ok: true, status: 200, json: async () => ({ data: { accessToken: 'native-lock' } }) };
  };
  await Promise.all([new SessionClient(fetcher).restore(), new SessionClient(fetcher).restore()]);
  assert(maximum === 1, 'Web Locks no serializa renovaciones concurrentes');
  document.body.dataset.result = 'passed';
  document.querySelector('#result').textContent = 'Contrato frontend correcto: rutas, móvil, registro, login, permisos, cierre y visor.';
} catch (error) {
  document.body.dataset.result = 'failed'; document.querySelector('#result').textContent = error.stack;
}
</script></body></html>
