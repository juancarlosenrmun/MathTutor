<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Prueba real WebGL2</title>
<canvas width="640" height="480" style="width:640px;height:480px"></canvas><p id="status"></p>
<script type="module">
import { WebGLViewer } from '/visor/viewer.mjs';
import { curve } from '/visor/curves.mjs';
import { surface } from '/visor/surfaces.mjs';
try {
  const canvas = document.querySelector('canvas');
  const viewer = new WebGLViewer(canvas, document.querySelector('#status'));
  const gl = viewer.gl;
  const pixels = new Uint8Array(canvas.width * canvas.height * 4);
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let drawn = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    if (pixels[i] > 50 || pixels[i + 1] > 50 || pixels[i + 2] > 50) drawn++;
  }
  if (drawn < 20 || gl.getError() !== gl.NO_ERROR) throw new Error('No se dibujan los ejes');
  const original = [...viewer.camera.matrix(1)];
  canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
  if (original.every((value, i) => value === viewer.camera.matrix(1)[i])) throw new Error('Cámara inmóvil');
  viewer.command('in');
  viewer.command('out');
  viewer.command('reset');
  viewer.setGraph(curve('x^2', -1, 1));
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let yellow = 0, blue = 0, area = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    if (pixels[i] > 200 && pixels[i+1] > 120 && pixels[i+2] < 100) yellow++;
    if (pixels[i] > 50 && pixels[i] < 130 && pixels[i+1] > 130 && pixels[i+2] > 150 && pixels[i+2] > 2*pixels[i]) blue++;
    if (pixels[i] > 20 && pixels[i] < 45 && pixels[i+1] > 55 && pixels[i+1] < 90) area++;
  }
  const graphicError = gl.getError();
  if (yellow < 10 || blue < 10 || area < 100 || graphicError !== gl.NO_ERROR) throw new Error(`Gráfica 2D incompleta: ${yellow}/${blue}/${area}, WebGL ${graphicError}`);
  viewer.setSurface(surface('x^2+y^2', -1, 1, -1, 1, 16));
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let meshPixels = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    if (pixels[i] > 40 && pixels[i] < 110 && pixels[i+1] > 120 && pixels[i+2] > 100) meshPixels++;
  }
  if (meshPixels < 100 || gl.getError() !== gl.NO_ERROR) throw new Error(`Superficie 3D incompleta: ${meshPixels}`);
  viewer.setSurface(surface('0', -1, 1, -1, 1, 16));
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const surfaceGreens = new Set();
  for (let i = 0; i < pixels.length; i += 4) {
    const [r, g, b] = pixels.subarray(i, i + 3);
    if (r < 75 && g > 70 && g > b && b > 2 * r) surfaceGreens.add(g);
  }
  if (surfaceGreens.size < 10) throw new Error('Textura visible ausente en la superficie plana');
  const readTangentPixels = () => {
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    const positions = [];
    for (let i = 0; i < pixels.length; i += 4) {
      const [red, green, blue] = pixels.subarray(i, i + 3);
      // El antialiasing mezcla la recta con el fondo; conserva el contraste magenta.
      if (red > 125 && red - green > 65 && blue - green > 35) positions.push(i);
    }
    const error = gl.getError();
    if (positions.length < 20 || error !== gl.NO_ERROR) throw new Error(`Tangente rosa ausente: ${positions.length} píxeles, WebGL ${error}`);
    return positions.join(',');
  };
  viewer.setGraph(curve('x^2', -1, 1, 64, -0.5));
  const firstLine = readTangentPixels();
  viewer.setGraph(curve('x^2', -1, 1, 64, 0.5));
  if (readTangentPixels() === firstLine) throw new Error('La recta no sigue el punto');
  viewer.setSurface(surface('x^2+y^2', -1, 1, -1, 1, 16, [0.5, -0.5]));
  readTangentPixels();
  viewer.setSurface(surface('x+y', -1, 1, -1, 1, 16, [0, 0]));
  const rectangle = canvas.getBoundingClientRect();
  for (const value of ['surface', 'plane']) {
    viewer.selectionMode = {value};
    viewer.select(rectangle.left + rectangle.width / 2, rectangle.top + rectangle.height / 2);
    if (!viewer.selection || viewer.selection.some(coordinate => Math.abs(coordinate) > 1e-6)) {
      throw new Error('La selección no alcanza el origen en ' + value);
    }
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let highlights = 0;
    for (let i = 0; i < pixels.length; i += 4) {
      if (pixels[i] > 250 && pixels[i + 1] > 230 && pixels[i + 2] > 105 && pixels[i + 2] < 125) highlights++;
    }
    if (highlights < 30 || gl.getError() !== gl.NO_ERROR) throw new Error('Marcador WebGL ausente en ' + value);
  }
  viewer.dispose();
  document.body.dataset.result = 'passed';
  document.body.dataset.drawn = drawn;
} catch (error) {
  document.body.dataset.result = 'failed';
  document.querySelector('#status').textContent = error.message;
}
</script></html>
